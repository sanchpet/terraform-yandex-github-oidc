name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      # Mocked provider: no cloud, no credentials.
      - run: terraform test
      - name: Example validates
        working-directory: examples/basic
        run: terraform init -backend=false && terraform validate
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - run: tflint --init && tflint
      # The same terraform-docs as mise.toml: other versions format the tables differently.
      - name: README docs block is current
        run: |
          curl -sSLo td.tgz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          tar -xzf td.tgz terraform-docs && rm td.tgz
          ./terraform-docs . && rm terraform-docs
          git diff --exit-code README.md

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
